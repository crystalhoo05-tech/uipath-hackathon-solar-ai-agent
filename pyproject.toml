[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hackathon-ai-uipath"
version = "0.1.0"
description = "Solar post-installation diagnostic agent API powered by Gemini on GCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "google-genai>=1.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
solar-diagnostic-api = "hackathon_ai_uipath.api.app:run"
hackathon-ai-uipath = "hackathon_ai_uipath.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hackathon_ai_uipath"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
